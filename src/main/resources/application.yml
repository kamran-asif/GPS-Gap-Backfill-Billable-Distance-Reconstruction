server:
  port: 8080

spring:
  application:
    name: moveinsync-trip-distance-engine

  datasource:
    url: jdbc:h2:mem:moveinsync_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 500ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: moveinsync-trip-distance-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.moveinsync.distance.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.moveinsync.distance: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [Tenant:%X{tenant_id:-none}] [Trace:%X{trace_id:-none}] - %msg%n"

engine:
  routing:
    provider-type: ${ENGINE_ROUTING_PROVIDER:simulated} # simulated | osrm
    osrm:
      base-url: ${OSRM_BASE_URL:http://router.project-osrm.org}
      timeout-ms: 1500
    redis-cache:
      enabled: ${ENGINE_REDIS_ENABLED:false} # true in production / docker
    rate-limit:
      # Client-side token bucket guarding outbound routing provider calls (Scaling Level 7).
      # 0 permits/second disables the limiter (default, single-instance behaviour).
      permits-per-second: 0
      burst: 0
  jwt:
    secret: ${JWT_SECRET:MoveInSyncEnterpriseSecretKeyForBillingEngine2026!}
    expiration-ms: 86400000 # 24 hours
  kafka:
    enabled: ${ENGINE_KAFKA_ENABLED:false} # true when Kafka cluster is present
    topics:
      gps-pings: trip-gps-pings
      adjustments: trip-adjustments
      milestones: trip-milestones
