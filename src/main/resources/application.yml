server:
  port: 8080

spring:
  application:
    name: moveinsync-trip-distance-engine

  datasource:
    url: jdbc:h2:mem:moveinsync_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.moveinsync.distance: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [Tenant:%X{tenant_id:-none}] [Trace:%X{trace_id:-none}] - %msg%n"

engine:
  routing:
    rate-limit:
      # Client-side token bucket guarding outbound routing provider calls (Scaling Level 7).
      # 0 permits/second disables the limiter (default, single-instance behaviour).
      permits-per-second: 0
      burst: 0
